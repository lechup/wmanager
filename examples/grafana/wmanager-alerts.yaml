# Alert rules for the lines wmanager sends to Loki, in the Loki ruler format (README: Grafana dashboard and alerts).
# Grafana Cloud: Alerts & IRM > Alert rules > New alert rule, one per rule with its expr; or load the file into the
# Loki ruler of the stack: lokitool rules load wmanager-alerts.yaml (address, user and a token with rules:write).
# The log lines are English on every computer, so these patterns hold whatever the computers' language.
groups:
  - name: wmanager
    rules:
      # An update or provisioning with errors (packages, scripts, the management source...)
      - alert: WmanagerRunErrors
        expr: sum by (host) (count_over_time({service_name="wmanager", job=~"update|retry|provision", level="error"}[1d])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'wmanager: {{ $labels.host }} had errors in an update or provisioning'
          description: '{{ $value }} error lines in the last day; in Grafana: {service_name="wmanager", host="{{ $labels.host }}", level="error"}'

      # A group job that failed (the task label is group/name)
      - alert: WmanagerJobErrors
        expr: sum by (host, task) (count_over_time({service_name="wmanager", job="jobs", level="error"}[1d])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'wmanager: job {{ $labels.task }} failed on {{ $labels.host }}'

      # A computer that ran in the last 14 days but not in the last 3: switched off, or wmanager stuck
      # (Healthchecks says the same per computer when it is set up)
      - alert: WmanagerSilent
        expr: sum by (host) (count_over_time({service_name="wmanager", job=~"update|retry|provision"}[14d])) unless sum by (host) (count_over_time({service_name="wmanager", job=~"update|retry|provision"}[3d]))
        labels:
          severity: info
        annotations:
          summary: 'wmanager: {{ $labels.host }} has not reported for 3 days'

      # The management source was refused (signature, another source, an older manifest, a file that doesn't match):
      # the computer keeps its last copy, so changes don't reach it
      - alert: WmanagerSourceRejected
        expr: sum by (host) (count_over_time({service_name="wmanager", level="error"} |= "Rejected the new version from the management source" [1d])) > 0
        labels:
          severity: critical
        annotations:
          summary: 'wmanager: {{ $labels.host }} rejected the management source'

      # A self-update that didn't install: the computer stays on the version it has
      - alert: WmanagerSelfUpdateFailed
        expr: sum by (host) (count_over_time({service_name="wmanager", level="error"} |~ "did not install itself|couldn't be changed" [1d])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'wmanager: {{ $labels.host }} could not switch its wmanager version or signing certificate'

      # The signing certificate of the source expires within 60 days (or has expired)
      - alert: WmanagerCertificateExpiring
        expr: count(sum by (host) (count_over_time({service_name="wmanager", level="warn"} |~ "The signing certificate (expires|expired) on" [1d]))) > 0
        labels:
          severity: warning
        annotations:
          summary: 'wmanager: the signing certificate expires soon ({{ $value }} computers say so); tools/wm.ps1 rotate-key'
