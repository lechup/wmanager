# wmanager: Loki of your own (docker-compose.yml). A tenant per company (X-Scope-OrgID, set by Caddy from the login),
# logs on the server's disk, kept 90 days (retention_period).
auth_enabled: true
server:
  http_listen_port: 3100
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 90d
  # No deletion over the API: nothing inside the network may take back an audit head (the retention still deletes)
  deletion_mode: disabled
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
