# wmanager: Grafana and Loki of your own (docs/monitoring.md: Hosting Grafana and Loki yourself), and wmanager-server
# with its PostgreSQL (docs/server.md). On a server with Docker, in this folder (with ../grafana next to it, as in the
# repository):
#   ./selfhosted.sh init                  the names, the e-mail for the certificates, the passwords
#   ./selfhosted.sh add-company <name>    a Loki tenant for the company, its logins, a Grafana data source and alerts,
#                                         a place for its management source
#   docker compose up -d
#   ./selfhosted.sh create-owner <e-mail> the owner of wmanager-server (asks for the password)
# Caddy gets the certificates (Let's Encrypt) and checks the logins; Loki keeps each company apart (a tenant each).
# wmanager-server has no port of its own: it is reached through Caddy only, whose address it trusts for
# X-Forwarded-For (a fixed address in the network "wm").
services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    networks:
      wm:
        ipv4_address: 172.31.250.2
    environment:
      LOKI_DOMAIN: ${LOKI_DOMAIN}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN}
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CADDY_GLOBAL: ${CADDY_GLOBAL:-}   # local_certs: certificates of Caddy's own (a test without public names)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/companies:ro
      - ./sources:/srv/sources:ro        # the companies' management sources (tools/wm.ps1 sync sends them here)
      - caddy-data:/data
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    networks: [wm]
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    networks: [wm]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # E-mail for the alerts (Alerting > Contact points): fill in .env
      GF_SMTP_ENABLED: ${SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${SMTP_HOST:-}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    networks: [wm]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password, owner-password, server-password]
    volumes:
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "wmanager"]
      interval: 5s
      timeout: 5s
      retries: 30
  wmanager:
    # Built from this repository until releases publish the image (docs/implementation.md, stage 6)
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: wmanager-server:local
    restart: unless-stopped
    networks: [wm]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WMANAGER_DATABASE_URL_FILE: /run/secrets/database-url
      WMANAGER_MIGRATE_DATABASE_URL_FILE: /run/secrets/migrate-database-url
      WMANAGER_PUBLIC_URL: https://${PANEL_DOMAIN}${PANEL_PORT_SUFFIX:-}
      WMANAGER_TRUSTED_PROXIES: 172.31.250.2
      WMANAGER_LOKI_URL: http://loki:3100
      WMANAGER_LOKI_HEAD_EVERY: ${WMANAGER_LOKI_HEAD_EVERY:-5m}
    secrets: [database-url, migrate-database-url]
networks:
  wm:
    ipam:
      config:
        # Caddy's fixed address is .2; the others take theirs from the upper half, so none can take Caddy's first
        - subnet: 172.31.250.0/24
          ip_range: 172.31.250.128/25
# Written by selfhosted.sh init in secrets/ (a folder only you can open; the files readable by the containers)
secrets:
  postgres-password:
    file: ./secrets/postgres-password
  owner-password:
    file: ./secrets/owner-password
  server-password:
    file: ./secrets/server-password
  database-url:
    file: ./secrets/database-url
  migrate-database-url:
    file: ./secrets/migrate-database-url
volumes:
  caddy-data: {}
  loki-data: {}
  grafana-data: {}
  postgres-data: {}
