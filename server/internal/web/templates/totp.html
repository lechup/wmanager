{{define "title"}}{{t "totp.title"}} · wmanager{{end}}
{{define "content"}}
<h1>{{t "totp.title"}}</h1>
<p>{{t "totp.scan"}}</p>
<div class="qrbox">{{.Data.QR}}</div>
<p>{{t "totp.secret"}} <code class="secret">{{.Data.Secret}}</code></p>
<form method="post" action="/signin/totp" class="stack">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>{{t "code.label"}} <input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></label>
  <button type="submit">{{t "totp.submit"}}</button>
</form>
{{end}}
