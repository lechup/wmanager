# Tests on a throwaway GitHub-hosted Windows runner (free for public repositories):
# - sign: builds and signs test management sources on Linux with tools/publish.sh (osslsigncode, throwaway key,
#   timestamped by DigiCert or Sectigo) and checks its timestamps
# - windows: Windows PowerShell 5.1: parses every script, runs the Pester tests, then the integration tests
#   (the osslsigncode signature and its timestamp on Windows, also of an expired certificate, the checks of a new
#   version, group scripts, jobs, the hourly task).
# - grafana: the dashboard and the alert rules of examples/grafana against a real Loki and Grafana, and the
#   self-hosting kit of examples/selfhosted end to end (Docker)
# - go: the Go code of v1 (gofmt, vet, tests, the Windows build, govulncheck, the licenses of the dependencies,
#   the installer's tag against osslsigncode); go-windows: its Windows-only code (the computer's key, NCrypt)
# - wizard-linux: the tests of the configuration wizard, the languages, the group tool and the companies helper
#   (tools/wm.ps1) in PowerShell 7 on Linux (init.ps1 and lib/Lang.ps1 run there too)
# It is Windows Server, not Windows 11 Home/Pro: debloat, privacy, notifications and Restore-Backup.ps1 still
# need a Windows 11 virtual machine (see docs/testing.md).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    name: Sign test sources (Linux)
    runs-on: ubuntu-24.04
    # osslsigncode signs PowerShell files only in newer versions; 26.04 has the same 2.13 the setup in docs/groups.md uses
    container: ubuntu:26.04
    steps:
      - name: Install tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends osslsigncode openssl shellcheck git ca-certificates
          osslsigncode --version

      - uses: actions/checkout@v7

      - name: Check shell scripts
        run: |
          bash -n tools/*.sh tests/ci/*.sh tests/vm/*.sh
          shellcheck -S error tools/*.sh tests/ci/*.sh tests/vm/*.sh

      - name: Build and sign test sources
        run: tests/ci/build-sources.sh ci-sources

      - uses: actions/upload-artifact@v7
        with:
          name: management-sources
          path: ci-sources
          retention-days: 3

  windows:
    name: Windows PowerShell 5.1
    needs: sign
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: management-sources
          path: ${{ runner.temp }}/sources

      - name: Parse all scripts
        shell: powershell
        run: .\tests\ci\Test-Syntax.ps1

      - name: Unit tests
        shell: powershell
        run: .\tests\ci\Invoke-Tests.ps1 -Kind Unit

      - name: Integration tests
        shell: powershell
        env:
          WM_CI_SOURCES: ${{ runner.temp }}\sources
        run: .\tests\ci\Invoke-Tests.ps1 -Kind Integration

  grafana:
    name: Grafana dashboard, alerts and self-hosting (Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Lines like the computers send into a real Loki: every query of the dashboard and of the alert rules runs and
      # finds what it should, Loki's ruler loads the rules, Grafana imports the dashboard
      - name: Check examples/grafana
        run: tests/ci/check-grafana.sh

      # The self-hosting kit end to end: init, two companies, docker compose up, logins, tenants, Grafana provisioning
      - name: Check examples/selfhosted
        run: tests/ci/check-selfhosted.sh

  # The Go code of v1 (docs/implementation.md): formatting, vet and tests on Linux, the Windows build checked from
  # Linux too, known vulnerabilities, and the licenses of the dependencies, which must fit GPL v3 (requirement 9)
  go:
    name: Go (Linux, and the Windows build)
    runs-on: ubuntu-24.04
    env:
      LICENSES: MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,MPL-2.0,ISC,GPL-3.0
      # The server's tests make a database and a role (not a superuser) of their own for each test
      WMANAGER_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/google/go-licenses/v2@v2.0.1

      - name: Format and vet
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::not formatted with gofmt: $unformatted"; exit 1; fi
          go vet ./...
          GOOS=windows go vet ./...

      - name: Tests
        run: go test -race ./...

      # wmanager-sign with security keys: libfido2 through cgo (the tests above use a software key)
      - name: wmanager-sign with libfido2
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libfido2-dev
          go vet -tags fido2 ./sign/...
          go test -tags fido2 ./sign/internal/fido/...
          go build -tags fido2 -o /dev/null ./sign/cmd/wmanager-sign

      - name: Windows build
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: Known vulnerabilities
        run: |
          govulncheck ./...
          GOOS=windows govulncheck ./...

      - name: Licenses of the dependencies
        run: |
          go-licenses check ./... --allowed_licenses="$LICENSES"
          GOOS=windows go-licenses check ./... --allowed_licenses="$LICENSES"

      # The installer's tag against a real Authenticode signature with a two-certificate chain
      - name: Tags keep osslsigncode's signature valid
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends osslsigncode
          tests/ci/check-certtag.sh

  # The agent's Windows-only code: the computer's key through NCrypt (the software provider; the TPM only where the
  # runner has one), as an administrator, which the runner is
  go-windows:
    name: Go (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tests
        run: go test ./internal/tpmkey/...

  wizard-linux:
    name: Configuration wizard (PowerShell 7, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # tools/wm.ps1 signs a new company's source; its test is skipped where osslsigncode can't sign PowerShell files
      - name: Install osslsigncode
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends osslsigncode rsync

      # The Ubuntu runner has PowerShell 7 (pwsh); the wizard must not depend on Windows
      - name: Wizard tests
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = @('tests/Init.Tests.ps1', 'tests/Lang.Tests.ps1', 'tests/Groups.Tests.ps1', 'tests/Wm.Tests.ps1')
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
